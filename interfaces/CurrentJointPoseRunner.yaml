%YAML 1.1
---
name: CurrentJointPoseRunner
spec_version: 1.2
spec_type: interface
description: "This capability reads the current manipulator joint positions from the 
              backend-owned planning joint-state topic and returns them as vectors."
interface:
  topics:
    "/manipulator_joint_states":
      type: "sensor_msgs::msg::JointState"
      description: "Backend-published manipulator joint-state stream containing the 
                    configured planning joints"
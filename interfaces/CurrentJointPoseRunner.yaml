%YAML 1.1
---
name: CurrentJointPoseRunner
spec_version: 1.2
spec_type: interface
description: "This capability reads the current manipulator joint positions from joint_states and returns the selected joints as comma-separated lists."
interface:
  topics:
    "/joint_states":
      type: "sensor_msgs::msg::JointState"
      description: "Joint-state stream used to read the current manipulator configuration"
%YAML 1.1
---
name: FilterCartesianGraspsRunner
spec_version: 1.2
spec_type: interface
description: "This capability filters a list of candidate Cartesian grasp poses to only those that are feasible for the manipulator in the current scene."
interface:
  services:
    "/check_cartesian_pose_feasibility":
      type: "grasping_msgs::srv::CheckCartesianPoseFeasibility"
      description: "Manipulator Cartesian feasibility service exposed by grasping_control"
%YAML 1.1
---
name: MoveToNamedPoseRunner
spec_version: 1.2
spec_type: interface
description: "This capability moves the manipulator to one of the named poses configured in grasping_control by sending a MoveToNamedPose action goal."
interface:
  actions:
    "/move_arm_to_named_pose":
      type: "grasping_msgs::action::MoveToNamedPose"
      description: "Manipulator named-pose action exposed by grasping_control"
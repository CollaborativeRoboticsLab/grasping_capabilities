%YAML 1.1
---
name: MoveToCartesianPoseRunner
spec_type: provider
spec_version: 1.2
description: "The provider for manipulator Cartesian motion requests routed through grasping_control."
implements: grasping_capabilities/MoveToCartesianPoseRunner
runner: capabilities2_runner::MoveToCartesianPoseRunner

definition:
  command: "<Runner interface=grasping_capabilities/MoveToCartesianPoseRunner provider=grasping_capabilities/MoveToCartesianPoseRunner x='$x' y='$y' z='$z' qx='$qx' qy='$qy' qz='$qz' qw='$qw' target_frame='$target_frame' />"
  configuration_parameters:
    - name: x
      type: double
      semantic_key: grasping.target_pose.x
      description: "Target x position in the supplied frame."
    - name: y
      type: double
      semantic_key: grasping.target_pose.y
      description: "Target y position in the supplied frame."
    - name: z
      type: double
      semantic_key: grasping.target_pose.z
      description: "Target z position in the supplied frame."
    - name: qx
      type: double
      optional: true
      default: 0.0
      semantic_key: grasping.target_pose.qx
      description: "Target orientation quaternion x component."
    - name: qy
      type: double
      optional: true
      default: 0.0
      semantic_key: grasping.target_pose.qy
      description: "Target orientation quaternion y component."
    - name: qz
      type: double
      optional: true
      default: 0.0
      semantic_key: grasping.target_pose.qz
      description: "Target orientation quaternion z component."
    - name: qw
      type: double
      optional: true
      default: 1.0
      semantic_key: grasping.target_pose.qw
      description: "Target orientation quaternion w component."
    - name: target_frame
      type: string
      optional: true
      default: "tcp"
      semantic_key: grasping.target_pose.target_frame
      description: "The frame which reaches the given pose. This is not the planning frame."
  runtime_parameters:
    output:
      - name: success
        type: bool
        semantic_key: grasping.target_pose.success
        description: "Whether the grasping action reported a successful execution."
      - name: message
        type: string
        semantic_key: grasping.target_pose.message
        description: "Result message reported by the arm action server."
%YAML 1.1
---
name: MoveToJointPoseRunner
spec_type: provider
spec_version: 1.2
description: "The provider for grasping-stack joint-space motion requests."
implements: moveit2_capabilities/MoveToJointPoseRunner
runner: capabilities2_runner::MoveToJointPoseRunner

definition:
  command: "<Runner interface=moveit2_capabilities/MoveToJointPoseRunner provider=moveit2_capabilities/MoveToJointPoseRunner joint_names='$joint_names' joint_positions='$joint_positions' />"
  configuration_parameters:
    - name: joint_names
      type: string[]
      semantic_key: moveit2.joint_goal.names
      description: "Ordered joint names for the target joint-space motion."
    - name: joint_positions
      type: double[]
      semantic_key: moveit2.joint_goal.positions
      description: "Ordered joint positions in radians matching joint_names."
  runtime_parameters:
    output:
      - name: message
        type: string
        semantic_key: moveit2.joint_goal.message
        description: "Status message describing the joint-space motion outcome."